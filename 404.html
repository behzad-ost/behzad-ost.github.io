<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Behzad Ousat</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1a1814">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #12100e;
            --text: #ece6db;
            --text-muted: #a89f90;
            --accent: #c9a227;
            --accent-hover: #e0b93a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            text-align: center;
            padding: 24px;
            background:
                radial-gradient(ellipse 60% 50% at 20% 25%, rgba(201, 162, 39, 0.14), transparent 55%),
                radial-gradient(ellipse 50% 40% at 80% 70%, rgba(90, 70, 40, 0.28), transparent 50%),
                var(--bg-deep);
        }

        .container {
            max-width: 520px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: "Syne", sans-serif;
            font-size: 110px;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 12px;
            background: linear-gradient(180deg, var(--accent), #8a7020);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        h2 {
            font-family: "Syne", sans-serif;
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 12px;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 28px;
            color: var(--text-muted);
        }

        .btn {
            display: inline-block;
            padding: 12px 28px;
            background: var(--accent);
            color: #1a1814;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(201, 162, 39, 0.28);
        }

        @media (max-width: 768px) {
            h1 { font-size: 80px; }
            h2 { font-size: 1.4rem; }
            p { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn">Go Back Home</a>
    </div>

    <script>
        setTimeout(function () {
            window.location.href = "/";
        }, 10000);
    </script>
</body>
</html>
